name: probe-capi
on:
  push:
    branches: [probe/capi-close]
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo test -p normfs-capi --test capi_test --no-run
      - name: loop
        run: |
          fails=0
          for i in $(seq 30); do
            RUST_LOG=warn cargo test -p normfs-capi --test capi_test a_follow_far -- --nocapture > out.txt 2>&1; if grep -q "PROBE close rc=7" out.txt; then
              fails=$((fails+1)); echo "=== run $i failed"; grep -E "panicked|PROBE" out.txt | head -40
            fi
          done
          echo "fails=$fails/30"
