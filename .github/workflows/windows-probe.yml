name: windows-probe
on:
  push:
    branches: [ci/windows-probe]
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: never
jobs:
  live:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: choco install protoc -y --no-progress
      - name: build server
        run: cargo build --release -p normfs --features server-bin --bin normfs-server
      - name: run server and clients
        shell: bash
        run: |
          ./target/release/normfs-server.exe --data-dir "$RUNNER_TEMP/nfs" > srv.log 2>&1 &
          sleep 8
          echo "== go client: 1 KiB writes and reads"
          (cd normfs_go/bench && go run ./cmd/benchmark --clients=4 --iterations=3000 --size=1024 --queue=bench/win --addr=127.0.0.1:8888) 2>&1 | tail -15
          echo "== go client: 64 KiB"
          (cd normfs_go/bench && go run ./cmd/benchmark --clients=2 --iterations=500 --size=65536 --queue=bench/win64 --addr=127.0.0.1:8888) 2>&1 | tail -8
          echo "== tcp behaviour"
          python .github/probe/live.py e2e
          echo "== data dir"
          find "$RUNNER_TEMP/nfs" -maxdepth 4 | head -30
          echo "== server log"
          grep -E "ERROR|WARN|panick" srv.log | head -20 || true
          tail -5 srv.log
